# Flatpak manifest for Aurora SD Tool.
#
#   flatpak install -y flathub org.freedesktop.Platform//24.08 \
#                              org.freedesktop.Sdk//24.08
#   flatpak-builder --user --install --force-clean build \
#       packaging/flatpak/io.github.franzjeger.AuroraSDTool.yml
#
# The application ID uses the packager's domain because this is third-party
# packaging of proprietary software. It cannot go on Flathub: the payload is
# not redistributable there and is not built from source. This manifest is for
# local and private-remote installs.
#
# Read packaging/flatpak/README.md before using it — a sandboxed Aurora is
# useful for the UI, but hooking games needs access to Steam's directories.

app-id: io.github.franzjeger.AuroraSDTool
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: aurora-sdtool

# Flatpak refuses to export anything not named after the app ID, so without
# these the bundle installs with no menu entry and no icon at all. These are
# top-level properties; set on a module they are silently ignored with only a
# warning. flatpak-builder rewrites the desktop file's Icon= key to match.
rename-desktop-file: aurora-sdtool.desktop
rename-icon: aurora-sdtool

# Applies to every module. Set per-module it does not stop the global debuginfo
# pass, which strips the vendored Skia and HarfBuzz libraries and leaves the
# payload no longer matching SHA256SUMS.
build-options:
  strip: false
  no-debuginfo: true

finish-args:
  # Avalonia renders through X11 only, so no Wayland socket is requested.
  - --socket=x11
  - --share=ipc
  - --device=dri

  # Aurora authenticates against CheatHappens and downloads trainers.
  - --share=network

  # Steam data, so Proton builds and the compatibility tool directory are
  # visible. Narrower than --filesystem=home, which upstream effectively needs.
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam
  # No /usr/share/steam: Flatpak reserves /usr for the runtime and refuses the
  # override with a warning on every launch. Distro-packaged Proton runners
  # living there are therefore invisible inside the sandbox — one more reason
  # to prefer a native package if you rely on them.

  # Where Aurora itself gets installed, and where games usually live.
  - --filesystem=~/Games:create
  - --filesystem=~/Downloads

  - --talk-name=org.freedesktop.Notifications

modules:
  - name: aurora-sdtool
    buildsystem: simple

    build-commands:
      - bash ./scripts/install.sh --prefix /app --destdir /
    sources:
      - type: dir
        path: ../..

  # Aurora's Avalonia UI falls back to boxes without a font on the host-less
  # sandbox, so ship one.
  - name: dejavu-fonts
    buildsystem: simple
    build-commands:
      - install -Dm644 ttf/DejaVuSans.ttf /app/share/fonts/DejaVuSans.ttf
      - install -Dm644 ttf/DejaVuSans-Bold.ttf /app/share/fonts/DejaVuSans-Bold.ttf
    sources:
      - type: archive
        url: https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
        sha256: fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7
