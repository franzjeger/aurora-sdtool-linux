name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils appstream

      - name: shellcheck
        run: shellcheck -x src/aurora-sdtool scripts/*.sh scripts/lib/*.sh tests/*.sh packaging/*/*.sh packaging/appimage/AppRun

      - name: Parse every script
        run: |
          for f in src/aurora-sdtool scripts/*.sh scripts/lib/*.sh tests/*.sh \
                   packaging/*/*.sh packaging/appimage/AppRun; do
            bash -n "$f"
          done

      - name: Validate the desktop entry
        run: desktop-file-validate share/applications/aurora-sdtool.desktop

      - name: Validate the AppStream metadata
        run: appstreamcli validate --no-net share/metainfo/io.github.franzjeger.AuroraSDTool.metainfo.xml

      - name: Check the version is consistent
        run: |
          version=$(cat VERSION)
          spec=$(awk '/^Version:/ {print $2; exit}' packaging/rpm/aurora-sdtool.spec)
          pkgbuild=$(awk -F= '/^pkgver=/ {print $2; exit}' packaging/arch/PKGBUILD)
          echo "VERSION=$version spec=$spec PKGBUILD=$pkgbuild"
          [ "$version" = "$spec" ] || { echo "::error::spec version $spec != VERSION $version"; exit 1; }
          [ "$version" = "$pkgbuild" ] || { echo "::error::PKGBUILD pkgver $pkgbuild != VERSION $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite builds its own fixture payload, so it runs whether or not the
      # proprietary payload is present. The install round trip self-skips when
      # vendor/ is empty.
      - name: Run the wrapper test suite
        run: tests/run-tests.sh

      - name: Report whether the payload was available
        run: |
          if [ -f vendor/AuroraLauncher ]; then
            echo "::notice::vendor/ payload present — install round trip ran"
          else
            echo "::notice::vendor/ payload absent — install round trip skipped (see LEGAL.md)"
          fi

  package:
    name: Package (${{ matrix.format }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@v4

      - name: Check for the payload
        id: payload
        run: |
          if [ -f vendor/AuroraLauncher ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.format }}: vendor/ has no payload."
          fi

      - name: Install build tools
        if: steps.payload.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.format == 'rpm' && 'rpm' || 'dpkg-dev' }}

      - name: Build
        if: steps.payload.outputs.present == 'true'
        run: make ${{ matrix.format }}

      - name: Upload
        if: steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-sdtool-${{ matrix.format }}
          path: |
            dist/**/*.deb
            dist/**/*.rpm
          if-no-files-found: error
